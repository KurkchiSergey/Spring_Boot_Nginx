server.port=8080

# Actuator: по умолчанию health-check живёт на /actuator/health.
# management.endpoints.web.base-path=/ переносит все actuator-эндпоинты
# в корень, поэтому health оказывается ровно на /health, как ждёт
# "curl http://localhost:8080/health" из задания.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
